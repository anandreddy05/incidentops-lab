services:
  postgres:
    image: postgres:16-alpine
    container_name: incidentops-lab-postgres

    environment:
      POSTGRES_DB: incidentops_lab
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidentops -d incidentops_lab
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data: